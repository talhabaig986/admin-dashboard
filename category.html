<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Category</title>
<!-- Favicon - Browser tab me chota icon -->
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
<style>

  /* ===== 1. POORA PAGE ===== */
  *{ box-sizing: border-box; }
  body{ margin: 0; font-family: Arial; background: #f2f2f2; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .wrapper{ display: flex; height: calc(100vh - 62px); overflow: hidden; flex: 1; }

  .main{ flex: 1; padding: 20px 30px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; }
  h1{ margin-top: 0; margin-bottom: 15px; }

  /* ===== 2. TOP BAR ===== */
  .top{ background: #2c3e50; color: white; padding: 10px 20px; font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; height: 62px; flex-shrink: 0; }
  .admin-img-top{ width: 42px; height: 42px; border-radius: 50%; background: white; padding: 2px; }

  /* ===== 3. SIDEBAR ===== */
  .sidebar{ background: #34495e; width: 200px; height: 100%; display: flex; flex-direction: column; padding-top: 10px; overflow: hidden; flex-shrink: 0; }
  .sidebar a{ display: block; color: white; text-decoration: none; padding: 18px 15px; font-size: 18px; border-bottom: 1px solid #3d5a73; transition: 0.3s; }
  .sidebar a:hover{ background: #2c3e50; padding-left: 25px; border-left: 4px solid #3498db; }
  .active{ background: #2c3e50; border-left: 4px solid #3498db; }
  .logout-btn{ background: #7b1a1a !important; color: white; margin: auto 20px 15px 20px !important; padding: 12px !important; text-align: center; display: block; text-decoration: none; font-size: 18px; border-radius: 6px; border-bottom: none !important; border-left: none !important; }
  .logout-btn:hover{ background: red !important; padding-left: 12px !important; border-left: none !important; }

  /* ===== 4. ADD CATEGORY ROW ===== */
  .top-row{ display: flex; gap: 10px; margin-bottom: 15px; }
  .top-row input{ flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
  .add-btn{ background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .add-btn:hover{ background: #c0392b; }

  /* ===== 5. WHITE BOX ===== */
  .box{ background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; flex: 1; overflow-y: auto; }

  /* ===== 6. TABLE ===== */
  table{ width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td{ border: 1px solid #ddd; padding: 10px; text-align: left; }
  th{ background: #ecf0f1; }

  /* ===== 7. BUTTON ===== */
  .btn{ padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-size: 14px; }
  .view{ background: #3498db; }
  .del{ background: #e74c3c; }

  /* ===== 8. NO CATEGORY MESSAGE ===== */
  .no-data{ text-align: center; padding: 40px 10px; color: #777; display: none; }
  .no-data .icon{ font-size: 40px; display: block; margin-bottom: 10px; }
  .no-data h3{ color: #2c3e50; margin: 0 0 5px 0; font-size: 19px; }
  .no-data p{ margin: 0; font-size: 15px; }

</style>
</head>
<body>

<!-- ===== 1. TOP BAR ===== -->
<div class="top">
  <span>Category</span>
  <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="admin-img-top">
</div>

<!-- ===== 2. WRAPPER START ===== -->
<div class="wrapper">

  <!-- ===== 3. SIDEBAR ===== -->
  <div class="sidebar">
    <a href="dashboard.html">🏠 Home</a>
    <a href="orders.html">📦 Orders</a>
    <a href="category.html" class="active">🛍️ Category</a>
    <a href="products.html">🛒 Products</a>
    <a href="customers.html">👥 Customer</a>
    <a href="settings.html">⚙️ Settings</a>
    <a href="index.html" class="logout-btn">🚪 Logout</a>
  </div>

  <!-- ===== 4. MAIN START ===== -->
  <div class="main">
    <h1>All Categories</h1>

    <!-- 4.1 ADD CATEGORY -->
    <div class="top-row">
      <input type="text" id="catName" placeholder="Enter Category Name">
      <button class="add-btn" id="catBtn">Add Category</button>
    </div>

    <!-- 4.2 TABLE BOX -->
    <div class="box">
      <h2 style="margin:0; font-size:19px;">Total Category</h2>
      <table id="catTable">
        <tr><th>S.no</th><th>Category Name</th><th>Action</th></tr>
        <tbody id="cat"></tbody>
      </table>

      <!-- Jab koi category na ho to ye dikhega -->
      <div class="no-data" id="noData">
        <span class="icon">🛍️</span>
        <h3>No Categories Found</h3>
        <p>No categories have been added yet. Please add a new category to get started.</p>
      </div>

    </div>

  </div>
  <!-- ===== MAIN END ===== -->

</div>
<!-- ===== WRAPPER END ===== -->

<script type="module">
    // FIX - Ab dashboard wali hi config use hogi, dobara initialize nahi karenge
    import { db, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "./config/firebase_config.js";

    let catName = document.getElementById("catName")
    let catBtn = document.getElementById("catBtn")
    let catList = document.getElementById("cat")
    let noData = document.getElementById("noData")
    let catTable = document.getElementById("catTable")
    let editId = null

    catBtn.addEventListener("click", saveCategory)

    // Add or update category
    async function saveCategory() {
        let name = catName.value.trim()

        if (name == "") {
            alert("Please enter category name")
            return
        }

        if (editId) {
            // If editing, update old category
            await updateDoc(doc(db, "Category", editId), { categoryName: name })
            editId = null
            catBtn.innerText = "Add Category"
        } else {
            // Add new category
            let newDoc = doc(collection(db, "Category"))
            await setDoc(newDoc, {
                categoryName: name,
                categoryKey: newDoc.id,
                createdAt: serverTimestamp() // Save time when category was created
            })
        }

        catName.value = ""
        showCategory()
    }

    // Show all categories
    async function showCategory() {
        let data = await getDocs(collection(db, "Category"))
        catList.innerHTML = ""

        // Agar koi category nahi hai to message dikhao, table chupao
        if (data.docs.length == 0) {
            catTable.style.display = "none"
            noData.style.display = "block"
            return
        }

        // Agar category hai to table dikhao, message chupao
        catTable.style.display = "table"
        noData.style.display = "none"

        let i = 1
        // for...of loop - ek ek category ko dikhana
        for (let row of data.docs) {
            let d = row.data()
            catList.innerHTML += `
                <tr>
                    <td>${i}</td>
                    <td>${d.categoryName}</td>
                    <td>
                        <button class="btn view" onclick="editCategory('${row.id}','${d.categoryName}')">Edit</button>
                        <button class="btn del" onclick="deleteCategory('${row.id}')">Delete</button>
                    </td>
                </tr>`
            i++
        }
    }

    // Edit button
    window.editCategory = function (id, name) {
        catName.value = name
        editId = id
        catBtn.innerText = "Update Category"
    }

    // Delete button
    window.deleteCategory = async function (id) {
        if (confirm("Are you sure you want to delete this category?")) {
            await deleteDoc(doc(db, "Category", id))
            showCategory()
        }
    }

    showCategory()
</script>

</body>
</html>
