<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3064/3064155.png">
<style>
  body{
    background-color: #2c3e50;
    font-family: Arial;
    margin: 0;
    padding: 0;
  }
  .box{
    background-color: white;
    width: 350px;
    margin: 80px auto;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
  }
  .circle{
    background-color: #2c3e50;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto;
    color: white;
    font-size: 30px;
    line-height: 70px;
  }
  h2{
    color: #2c3e50;
    margin-bottom: 5px;
  }
  .admin-info{
    background-color: #f2f2f2;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    color: #333;
    margin: 15px 0;
    text-align: left;
  }
  label{
    display: block;
    text-align: left;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 5px;
  }
  input{
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
  }
  button{
    width: 100%;
    background-color: #2c3e50;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 5px;
    margin-top: 25px;
    font-size: 16px;
    cursor: pointer;
  }
  p{
    color: grey;
    font-size: 13px;
    margin-top: 20px;
  }
  #error{
    color: red;
    font-size: 14px;
    display: none;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="box">
  <div class="circle">👤</div>
  <h2>Admin Login</h2>

  <!-- Checker ke liye oopar hi likh diya -->
  <div class="admin-info">
    <b>Admin Email:</b> admin@admin.com<br>
    <b>Admin Password:</b> admin@123
  </div>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="Enter Your Email">

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter Your Password">

  <button onclick="login()">Login</button>

  <p id="error">Wrong Email or Password!</p>

  <p>Admin Dashboard</p>
</div>

<script>
function login(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;

  if(email == "admin@admin.com" && password == "admin@123"){
    alert("Login Successful!");
    window.location.href = "dashboard.html";
  }
  else{
    document.getElementById("error").style.display = "block";
  }
}
</script>

</body>
</html>
