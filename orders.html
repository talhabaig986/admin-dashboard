<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Orders</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
<style>
  *{ box-sizing: border-box; } /* border padding andar */
  body{ margin: 0; /* bahar gap khatam */
    font-family: Arial; /* likhai style */
    background-color: #f2f2f2; /* halka grey */
    height: 100vh; /* poori screen */
    overflow: hidden; /* scroll band */
    display: flex; flex-direction: column; } /* upar neeche */

  .wrapper{ display: flex; /* sidebar + main side by side */
    height: calc(100vh - 62px); /* top minus karke */
    overflow: hidden; flex: 1; } /* bachi jagah */

  .main{ flex: 1; /* bachi poori width */
    padding: 20px 30px; /* andar gap */
    height: 100%; overflow: hidden; /* scroll band */
    display: flex; flex-direction: column; } /* upar neeche */

  h1{ margin-top: 0; margin-bottom: 15px; } /* heading gap */

  /* TOP BAR */
  .top{ background-color: #2c3e50; /* dark blue */
    color: white; /* likhai white */
    padding: 10px 20px; /* andar gap */
    font-size: 22px; font-weight: bold; /* bara mota */
    display: flex; justify-content: space-between; /* dono kono */
    align-items: center; /* beech me */
    height: 62px; flex-shrink: 0; } /* height fix */

  .admin-img-top{ width: 42px; height: 42px; /* photo size */
    border-radius: 50%; /* gol photo */
    background: white; padding: 2px; } /* white border */

  /* SIDEBAR */
  .sidebar{ background-color: #34495e; /* sidebar color */
    width: 200px; /* chaudai */
    height: 100%; /* poori height */
    display: flex; flex-direction: column; /* upar neeche */
    padding-top: 10px; overflow: hidden; flex-shrink: 0; } /* sikurna band */

  .sidebar a{ display: block; /* poori line */
    color: white; text-decoration: none; /* underline khatam */
    padding: 18px 15px; /* andar gap */
    font-size: 18px; /* likhai size */
    border-bottom: 1px solid #3d5a73; /* neeche line */
    transition: 0.3s; } /* halka animation */

  .sidebar a:hover{ background-color: #2c3e50; /* hover dark */
    padding-left: 25px; /* hover aage */
    border-left: 4px solid #3498db; } /* neeli line */

  .active{ background-color: #2c3e50; /* is page ka button dark */
    border-left: 4px solid #3498db; } /* neeli nishani */

  .logout-btn{ background-color: #7b1a1a !important; /* laal */
    color: white; margin: auto 20px 15px 20px !important; /* neeche chipka */
    padding: 12px !important; text-align: center; /* beech me */
    display: block; text-decoration: none; font-size: 18px;
    border-radius: 6px; /* gol kone */
    border-bottom: none !important; border-left: none !important; }

  .logout-btn:hover{ background-color: red !important; /* hover full laal */
    padding-left: 12px !important; border-left: none !important; }

  /* SEARCH + FILTER */
  .top-row{ display: flex; /* search + filter side by side */
    gap: 10px; margin-bottom: 15px; } /* beech gap */

  .top-row input{ flex: 1; /* bachi width */
    padding: 10px; border: 1px solid #ddd; /* halki line */
    border-radius: 6px; font-size: 16px; /* likhai size */
    outline: none; } /* blue outline band */

  .top-row select{ padding: 10px; /* andar gap */
    border: 1px solid #ddd; border-radius: 6px; /* gol kone */
    font-size: 16px; } /* likhai size */

  /* TABLE BOX */
  .box{ background-color: white; padding: 20px; /* andar gap */
    border-radius: 8px; /* gol kone */
    box-shadow: 0 2px 8px #ccc; /* halka saya */
    flex: 1; overflow: hidden; } /* bachi jagah */

  table{ width: 100%; /* poori chaudai */
    border-collapse: collapse; /* double line khatam */
    margin-top: 10px; }
  th, td{ border: 1px solid #ddd; /* halki line */
    padding: 12px; text-align: left; } /* likhai left */
  th{ background-color: #ecf0f1; } /* heading grey */
  .pending{ color: #7a7a00; font-weight: bold; } /* peela */
  .complete{ color: green; font-weight: bold; } /* hara */
  .cancel{ color: red; font-weight: bold; } /* laal */

  .btn{ padding: 6px 12px; /* andar gap */
    border: none; border-radius: 5px; /* gol kone */
    cursor: pointer; color: white; /* haath cursor */
    font-size: 14px; } /* likhai size */
  .view{ background-color: #3498db; } /* neela button */
  .del{ background-color: #e74c3c; } /* laal button */
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top">
  <span>Orders</span>
  <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="admin-img-top">
</div>

<div class="wrapper">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="dashboard.html">🏠 Home</a>
    <a href="orders.html" class="active">📦 Orders</a>
    <a href="products.html">🛒 Products</a>
    <a href="customers.html">👥 Customer</a>
    <a href="settings.html">⚙️ Settings</a>
    <a href="index.html" class="logout-btn">🚪 Logout</a>
  </div>

  <!-- MAIN -->
  <div class="main">
    <h1>All Orders</h1>

    <!-- SEARCH + FILTER -->
    <div class="top-row">
      <input type="text" placeholder="Search order / customer...">
      <select>
        <option>All Status</option>
        <option>Pending</option>
        <option>Complete</option>
        <option>Cancel</option>
      </select>
    </div>

    <!-- TABLE -->
    <div class="box">
      <table>
        <tr><th>Order Id</th><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th><th>Action</th></tr>
        <tr><td>#101</td><td>Ali</td><td>Shoes</td><td>$2000</td><td class="pending">Pending</td><td><button class="btn view">View</button> <button class="btn del">Delete</button></td></tr>
        <tr><td>#102</td><td>Omer</td><td>Watch</td><td>$200</td><td class="complete">Complete</td><td><button class="btn view">View</button> <button class="btn del">Delete</button></td></tr>
        <tr><td>#103</td><td>Saqib</td><td>Shirt</td><td>$120</td><td class="cancel">Cancel</td><td><button class="btn view">View</button> <button class="btn del">Delete</button></td></tr>
        <tr><td>#104</td><td>Ahmed</td><td>Bag</td><td>$350</td><td class="pending">Pending</td><td><button class="btn view">View</button> <button class="btn del">Delete</button></td></tr>
        <tr><td>#105</td><td>Bilal</td><td>Cap</td><td>$80</td><td class="complete">Complete</td><td><button class="btn view">View</button> <button class="btn del">Delete</button></td></tr>
      </table>
    </div>
  </div>
</div>

</body>
</html>
