<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Products</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/679/679922.png">
<style>
  *{ box-sizing: border-box; }
  body{ margin: 0; font-family: Arial; background: #f2f2f2; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .wrapper{ display: flex; height: calc(100vh - 62px); overflow: hidden; flex: 1; }
  .main{ flex: 1; padding: 20px 30px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; }
  h1{ margin-top: 0; margin-bottom: 15px; }
  .top{ background: #2c3e50; color: white; padding: 10px 20px; font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; height: 62px; flex-shrink: 0; }
  .admin-img-top{ width: 42px; height: 42px; border-radius: 50%; background: white; padding: 2px; }
  .sidebar{ background: #34495e; width: 200px; height: 100%; display: flex; flex-direction: column; padding-top: 10px; overflow: hidden; flex-shrink: 0; }
  .sidebar a{ display: block; color: white; text-decoration: none; padding: 18px 15px; font-size: 18px; border-bottom: 1px solid #3d5a73; transition: 0.3s; }
  .sidebar a:hover{ background: #2c3e50; padding-left: 25px; border-left: 4px solid #3498db; }
  .active{ background: #2c3e50; border-left: 4px solid #3498db; }
  .logout-btn{ background: #7b1a1a !important; color: white; margin: auto 20px 15px 20px !important; padding: 12px !important; text-align: center; display: block; text-decoration: none; font-size: 18px; border-radius: 6px; border-bottom: none !important; border-left: none !important; }
  .logout-btn:hover{ background: red !important; padding-left: 12px !important; border-left: none !important; }
  .top-row{ display: flex; gap: 10px; margin-bottom: 15px; }
  .top-row input, .top-row select{ padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
  .top-row input{ flex: 1; }
  .add-box{ background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
  .add-box input, .add-box select{ padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; flex: 1; min-width: 130px; }
  .add-box input[type="file"]{ padding: 7px; background: #fafafa; }
  .add-btn{ background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .add-btn:hover{ background: #c0392b; }
  .box{ background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; flex: 1; overflow-y: auto; }
  table{ width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td{ border: 1px solid #ddd; padding: 10px; text-align: left; }
  th{ background: #ecf0f1; }
 #uploadLabel{
  flex: 1;
  min-width: 130px;
  height: 44px;
  border: 1px dashed #bbb;
  border-radius: 6px;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  font-size: 15px;
  color: #555;
}
#uploadLabel:hover{ border-color: #e74c3c; color: #e74c3c; }
#imgPreview{ width: 100%; height: 100%; object-fit: cover; display: none; }
  td img{ width: 60px; height: 60px; border-radius: 5px; object-fit: cover; }
  .btn{ padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-size: 14px; }
  .view{ background: #3498db; }
  .del{ background: #e74c3c; }
  .no-data{ text-align: center; padding: 40px 10px; color: #777; display: none; }
  .no-data .icon{ font-size: 40px; display: block; margin-bottom: 10px; }
  .no-data h3{ color: #2c3e50; margin: 0 0 5px 0; font-size: 19px; }
  .no-data p{ margin: 0; font-size: 15px; }
  #imgPreview{ width: 60px; height: 60px; object-fit: cover; border-radius: 5px; display: none; border: 1px solid #ddd; }
</style>
</head>
<body>

<div class="top">
  <span>Products</span>
  <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="admin-img-top">
</div>

<div class="wrapper">
  <div class="sidebar">
    <a href="dashboard.html">🏠 Home</a>
    <a href="orders.html">📦 Orders</a>
    <a href="category.html">🛍️ Category</a>
    <a href="products.html" class="active">🛒 Products</a>
    <a href="customers.html">👥 Customer</a>
    <a href="settings.html">⚙️ Settings</a>
    <a href="index.html" class="logout-btn">🚪 Logout</a>
  </div>

  <div class="main">
    <h1>All Products</h1>

    <div class="add-box">
      <input type="text" id="pName" placeholder="Product Name">
      <input type="number" id="pPrice" placeholder="Price">
      <input type="number" id="pStock" placeholder="Stock">
      <select id="pCategory">
        <option value="">Select Category</option>
      </select>
<label for="pImage" id="uploadLabel">
  <span id="uploadText">📷 Upload Photo</span>
  <img id="imgPreview">
</label>
<input type="file" id="pImage" accept="image/*" style="display:none">
    </div>

    <div class="top-row">
      <input type="text" id="searchInput" placeholder="Search product...">
      <select id="catFilter">
        <option value="all">All Category</option>
      </select>
    </div>

    <div class="box">
      <table id="productTable">
        <thead>
          <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr>
        </thead>
        <tbody id="productList"></tbody>
      </table>
      <div class="no-data" id="noData">
        <span class="icon">🛒</span>
        <h3>No Products Found</h3>
        <p>No products have been added yet. Please add a new product to get started.</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "./config/firebase_config.js";

  let pName = document.getElementById("pName")
  let pPrice = document.getElementById("pPrice")
  let pStock = document.getElementById("pStock")
  let pCategory = document.getElementById("pCategory")
  let pImage = document.getElementById("pImage")
  let imgPreview = document.getElementById("imgPreview")
  let addBtn = document.getElementById("addBtn")
  let searchInput = document.getElementById("searchInput")
  let catFilter = document.getElementById("catFilter")
  let productList = document.getElementById("productList")
  let productTable = document.getElementById("productTable")
  let noData = document.getElementById("noData")

  let editId = null
  let allProducts = []
  let selectedImage = ""
  let oldImage = ""

  addBtn.addEventListener("click", saveProduct)
  searchInput.addEventListener("input", showProducts)
  catFilter.addEventListener("change", showProducts)

  pImage.addEventListener("change", function(){
    let file = pImage.files[0]
    if(!file) return
    let reader = new FileReader()
    reader.onload = function(e){
      selectedImage = e.target.result
      imgPreview.src = selectedImage
      imgPreview.style.display = "block"
    }
    reader.readAsDataURL(file)
  })

  async function loadCategories() {
    try{
      let data = await getDocs(collection(db, "Category"))
      pCategory.innerHTML = '<option value="">Select Category</option>'
      catFilter.innerHTML = '<option value="all">All Category</option>'
      for (let row of data.docs) {
        let name = row.data().categoryName
        if(!name) continue
        pCategory.innerHTML += `<option value="${name}">${name}</option>`
        catFilter.innerHTML += `<option value="${name}">${name}</option>`
      }
    }catch(e){
      console.log(e)
      alert("Category load nahi ho saki")
    }
  }

  async function saveProduct() {
    let name = pName.value.trim()
    let price = pPrice.value
    let stock = pStock.value
    let category = pCategory.value

    let finalImage = selectedImage || oldImage

    if (name == "" || price == "" || stock == "" || category == "" || finalImage == "") {
      alert("Please fill all fields: Name, Price, Stock, Category aur Image lazmi hai")
      return
    }

    if (Number(price) <= 0 || Number(stock) < 0) {
      alert("Price 0 se zyada aur Stock 0 ya zyada hona chahiye")
      return
    }

    try{
      if (editId) {
        await updateDoc(doc(db, "Products", editId), {
          productName: name,
          price: Number(price),
          stock: Number(stock),
          category: category,
          image: finalImage
        })
        editId = null
        addBtn.innerText = "Add Product"
      } else {
        let newDoc = doc(collection(db, "Products"))
        await setDoc(newDoc, {
          productName: name,
          price: Number(price),
          stock: Number(stock),
          category: category,
          image: finalImage,
          productKey: newDoc.id,
          createdAt: serverTimestamp()
        })
      }

      pName.value = ""
      pPrice.value = ""
      pStock.value = ""
      pCategory.value = ""
      pImage.value = ""
      selectedImage = ""
      oldImage = ""
      imgPreview.style.display = "none"
      imgPreview.src = ""

      getProducts()
    }catch(e){
      console.log(e)
      alert("Product save nahi ho saka, dobara try karo")
    }
  }

  async function getProducts() {
    try{
      let data = await getDocs(collection(db, "Products"))
      allProducts = []
      for (let row of data.docs) {
        allProducts.push({ id: row.id, ...row.data() })
      }
      showProducts()
    }catch(e){
      console.log(e)
    }
  }

  function showProducts() {
    let searchText = searchInput.value.toLowerCase()
    let selectedCat = catFilter.value

    let filtered = []
    for (let p of allProducts) {
      let nameMatch = (p.productName || "").toLowerCase().indexOf(searchText) != -1
      let catMatch = selectedCat == "all" || p.category == selectedCat
      if (nameMatch && catMatch) {
        filtered.push(p)
      }
    }

    if (filtered.length == 0) {
      productTable.style.display = "none"
      noData.style.display = "block"
      productList.innerHTML = ""
      return
    }

    productTable.style.display = "table"
    noData.style.display = "none"
    productList.innerHTML = ""

    for (let p of filtered) {
      productList.innerHTML += `
        <tr>
          <td><img src="${p.image || ""}"></td>
          <td>${p.productName || ""}</td>
          <td>${p.category || ""}</td>
          <td>$${p.price || 0}</td>
          <td>${p.stock || 0}</td>
          <td>
            <button class="btn view" onclick="editProduct('${p.id}')">Edit</button>
            <button class="btn del" onclick="deleteProduct('${p.id}')">Delete</button>
          </td>
        </tr>`
    }
  }

  window.editProduct = function(id) {
    let found = null
    for (let item of allProducts) {
      if (item.id == id) {
        found = item
        break
      }
    }
    if(!found) return
    pName.value = found.productName || ""
    pPrice.value = found.price || ""
    pStock.value = found.stock || ""
    pCategory.value = found.category || ""
    oldImage = found.image || ""
    selectedImage = ""
    pImage.value = ""
    if(oldImage){
      imgPreview.src = oldImage
      imgPreview.style.display = "block"
    }
    editId = id
    addBtn.innerText = "Update Product"
  }

  window.deleteProduct = async function(id) {
    if (confirm("Are you sure you want to delete this product?")) {
      try{
        await deleteDoc(doc(db, "Products", id))
        getProducts()
      }catch(e){
        console.log(e)
        alert("Delete nahi ho saka")
      }
    }
  }

  loadCategories()
  getProducts()
</script>

</body>
</html>
